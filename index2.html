<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17130f">
<title>Buku Puisi Digital</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#3b3024 0,#17130f 45%,#0d0b09 100%);
    color:#eee5d7;
    font-family:'Inter',sans-serif;
    min-height:100vh;
}

/* =========================
   GLOBAL
========================= */

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.screen{
    min-height:100vh;
}

/* =========================
   COVER
========================= */

#coverScreen{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 18px;
}

.cover-area{
    width:min(420px,100%);
    text-align:center;
}

.book-shadow{
    filter:drop-shadow(0 25px 30px rgba(0,0,0,.55));
}

.book-cover{
    position:relative;
    width:100%;
    aspect-ratio:3/4.2;
    max-height:620px;
    overflow:hidden;
    border-radius:5px 13px 13px 5px;
    background:
        linear-gradient(135deg,rgba(255,255,255,.08),transparent 30%),
        linear-gradient(145deg,#33271b,#17110c);
    border:1px solid rgba(255,255,255,.14);
}

.book-cover::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(220,188,130,.45);
    pointer-events:none;
}

.book-cover::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:9px;
    height:100%;
    background:linear-gradient(90deg,
        rgba(0,0,0,.65),
        rgba(255,255,255,.08),
        rgba(0,0,0,.2));
}

.cover-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.52;
}

.cover-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(15,10,5,.15),
        rgba(15,10,5,.55) 55%,
        rgba(8,5,3,.9)
    );
}

.cover-content{
    position:absolute;
    inset:35px 30px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    z-index:2;
}

.cover-small{
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#d9bc89;
}

.cover-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(42px,11vw,70px);
    line-height:.9;
    font-weight:600;
    color:#f4eadb;
    text-shadow:0 3px 15px #000;
    word-break:break-word;
}

.cover-author{
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    color:#d8c09a;
}

.cover-decoration{
    font-size:26px;
    color:#c7a873;
    letter-spacing:8px;
}

.cover-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:24px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:30px;
    padding:13px 22px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:#c8a66a;
    color:#17110b;
}

.btn-secondary{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#eee5d7;
}

/* =========================
   READER
========================= */

#readerScreen{
    padding:22px 12px 50px;
}

.reader-top{
    width:min(900px,100%);
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.brand-mini{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;
    color:#e6c98e;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:white;
}

/* BOOK */

.real-book{
    width:min(900px,100%);
    margin:auto;
    perspective:1600px;
}

.paper{
    position:relative;
    background:
        radial-gradient(circle at 20% 20%,rgba(100,70,30,.04),transparent 20%),
        #f2eadb;
    color:#30281f;
    min-height:650px;
    border-radius:4px 12px 12px 4px;
    box-shadow:
        0 25px 60px rgba(0,0,0,.5),
        inset 10px 0 15px rgba(0,0,0,.06);
    overflow:hidden;
}

.paper::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:22px;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.12),
        rgba(255,255,255,.15),
        transparent
    );
}

.paper-content{
    position:relative;
    padding:60px clamp(35px,8vw,85px);
    min-height:650px;
}

.paper-inner{
    max-width:650px;
    margin:auto;
}

.book-heading{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:44px;
    font-weight:600;
    margin-bottom:12px;
}

.book-subheading{
    text-align:center;
    color:#806c54;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.ornament{
    text-align:center;
    margin:30px 0;
    color:#a58658;
    letter-spacing:10px;
}

.toc{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:30px;
}

.toc-item{
    display:flex;
    align-items:flex-end;
    gap:8px;
    border:0;
    background:none;
    padding:12px 2px;
    color:#3a3025;
    text-align:left;
    font-family:'Cormorant Garamond',serif;
    font-size:21px;
}

.toc-item:hover{
    color:#98733c;
}

.toc-line{
    flex:1;
    border-bottom:1px dotted #b6a58d;
    margin-bottom:5px;
}

/* POEM */

.poem-number{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#927b5b;
    margin-bottom:15px;
}

.poem-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(38px,7vw,58px);
    line-height:1;
    margin-bottom:8px;
}

.poem-date{
    font-size:12px;
    color:#9a8a74;
    margin-bottom:35px;
}

.poem-text{
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    line-height:1.65;
    white-space:pre-wrap;
}

.paper-footer{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    text-align:center;
    color:#9c8c76;
    font-size:11px;
}

/* CONTROLS */

.reader-controls{
    width:min(900px,100%);
    margin:15px auto 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.nav-btn{
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.07);
    color:#eee5d7;
    border-radius:25px;
    padding:11px 20px;
}

.nav-btn:disabled{
    opacity:.35;
}

.page-info{
    color:#b9aa96;
    font-size:12px;
}

/* =========================
   AUTHOR
========================= */

#authorScreen{
    padding:25px 15px 60px;
}

.author-wrap{
    width:min(850px,100%);
    margin:auto;
}

.author-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
}

.author-header h1{
    font-family:'Cormorant Garamond',serif;
    font-size:36px;
}

.author-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    backdrop-filter:blur(10px);
}

.author-card h2{
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:12px;
    color:#bcae9c;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(0,0,0,.25);
    color:white;
    border-radius:10px;
    padding:13px;
    font-family:inherit;
    outline:none;
}

textarea{
    min-height:250px;
    resize:vertical;
    line-height:1.6;
}

input:focus,
textarea:focus{
    border-color:#c8a66a;
}

.author-poem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.author-poem:last-child{
    border-bottom:0;
}

.author-poem-title{
    font-family:'Cormorant Garamond',serif;
    font-size:23px;
}

.author-poem-actions{
    display:flex;
    gap:6px;
}

.small-btn{
    padding:8px 12px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:white;
    font-size:12px;
}

.danger{
    border-color:rgba(255,80,80,.3);
    color:#ffb0b0;
}

.empty{
    color:#9f9385;
    text-align:center;
    padding:25px 0;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    backdrop-filter:blur(6px);
}

.modal{
    width:min(500px,100%);
    background:#211b15;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:25px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal h2{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    margin-bottom:15px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

/* =========================
   PAGE ANIMATION
========================= */

.flip-in{
    animation:flipIn .5s ease;
}

@keyframes flipIn{
    0%{
        opacity:0;
        transform:rotateY(-8deg) translateX(25px);
    }
    100%{
        opacity:1;
        transform:rotateY(0) translateX(0);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .cover-content{
        inset:30px 22px;
    }

    .cover-title{
        font-size:48px;
    }

    .paper{
        min-height:600px;
    }

    .paper-content{
        padding:45px 32px;
        min-height:600px;
    }

    .book-heading{
        font-size:37px;
    }

    .poem-text{
        font-size:20px;
    }

    .author-header{
        align-items:flex-start;
    }

    .author-header h1{
        font-size:30px;
    }

    .author-poem{
        align-items:flex-start;
        flex-direction:column;
    }

    .author-poem-actions{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- =========================
     COVER SCREEN
========================= -->

<section id="coverScreen" class="screen">

    <div class="cover-area">

        <div class="book-shadow">

            <div class="book-cover">

                <img id="coverImage"
                     class="cover-image hidden"
                     alt="Cover">

                <div class="cover-overlay"></div>

                <div class="cover-content">

                    <div class="cover-small">
                        Kumpulan Puisi
                    </div>

                    <div>
                        <div id="coverTitle"
                             class="cover-title">
                            Buku Puisiku
                        </div>

                        <div class="cover-decoration">
                            ✦ ✧ ✦
                        </div>
                    </div>

                    <div>
                        <div id="coverAuthor"
                             class="cover-author">
                            Karya Saya
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <div class="cover-buttons">

            <button class="btn btn-primary"
                    onclick="openReader()">
                📖 Buka Buku
            </button>

            <button class="btn btn-secondary"
                    onclick="authorLogin()">
                ✎ Mode Penulis
            </button>

        </div>

    </div>

</section>


<!-- =========================
     READER SCREEN
========================= -->

<section id="readerScreen"
         class="screen hidden">

    <div class="reader-top">

        <div id="readerBrand"
             class="brand-mini">
            Buku Puisiku
        </div>

        <div class="top-actions">

            <button class="icon-btn"
                    onclick="goCover()"
                    title="Kembali ke cover">
                ↩
            </button>

            <button class="icon-btn"
                    onclick="authorLogin()"
                    title="Mode Penulis">
                ✎
            </button>

        </div>

    </div>


    <div class="real-book">

        <div id="paper"
             class="paper">

            <div id="paperContent"
                 class="paper-content">
            </div>

            <div class="paper-footer">
                ✦ Buku Puisi Digital ✦
            </div>

        </div>

    </div>


    <div class="reader-controls">

        <button id="prevBtn"
                class="nav-btn"
                onclick="previousPage()">
            ← Sebelumnya
        </button>

        <span id="pageInfo"
              class="page-info">
            1 / 1
        </span>

        <button id="nextBtn"
                class="nav-btn"
                onclick="nextPage()">
            Berikutnya →
        </button>

    </div>

</section>


<!-- =========================
     AUTHOR SCREEN
========================= -->

<section id="authorScreen"
         class="screen hidden">

    <div class="author-wrap">

        <div class="author-header">

            <div>
                <h1>Mode Penulis</h1>
                <div style="color:#9f9385;font-size:12px;">
                    Kelola buku dan kumpulan puisimu
                </div>
            </div>

            <button class="btn btn-secondary"
                    onclick="goCover()">
                ← Keluar
            </button>

        </div>


        <!-- COVER SETTINGS -->

        <div class="author-card">

            <h2>📕 Pengaturan Sampul</h2>

            <div class="form-group">

                <label>Judul buku</label>

                <input id="titleInput"
                       type="text"
                       placeholder="Masukkan judul buku">

            </div>


            <div class="form-group">

                <label>Nama penulis</label>

                <input id="authorInput"
                       type="text"
                       placeholder="Masukkan nama penulis">

            </div>


            <div class="form-group">

                <label>Foto sampul</label>

                <input id="coverInput"
                       type="file"
                       accept="image/*">

            </div>


            <button class="btn btn-primary"
                    onclick="saveCover()">
                Simpan Sampul
            </button>

        </div>


        <!-- POEM MANAGEMENT -->

        <div class="author-card">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
                margin-bottom:10px;
            ">

                <h2 style="margin:0;">
                    📜 Kumpulan Puisi
                </h2>

                <button class="btn btn-primary"
                        onclick="newPoem()">
                    + Puisi Baru
                </button>

            </div>


            <div id="authorPoemList">
            </div>

        </div>


        <!-- PASSWORD -->

        <div class="author-card">

            <h2>🔐 Keamanan</h2>

            <p style="
                color:#aaa;
                font-size:13px;
                line-height:1.6;
                margin-bottom:15px;
            ">
                Kamu dapat mengganti password Mode Penulis.
            </p>

            <button class="btn btn-secondary"
                    onclick="changePassword()">
                Ganti Password
            </button>

        </div>

    </div>

</section>


<!-- =========================
     MODAL
========================= -->

<div id="modalBg"
     class="modal-bg hidden">

    <div id="modalContent"
         class="modal">
    </div>

</div>


<script>

/* =========================================
   DATA
========================================= */

const DATA_KEY = "buku_puisi_digital_v2";
const PASSWORD_KEY = "password_penulis_v2";

let data = {
    title: "Buku Puisiku",
    author: "Karya Saya",
    photo: "",
    poems: []
};

let currentPage = 0;


/* =========================================
   LOAD DATA
========================================= */

function loadData(){

    const saved = localStorage.getItem(DATA_KEY);

    if(saved){

        try{
            data = JSON.parse(saved);
        }
        catch(e){
            console.log("Data rusak");
        }

    }

    if(!Array.isArray(data.poems)){
        data.poems = [];
    }

}


/* =========================================
   SAVE DATA
========================================= */

function saveData(){

    localStorage.setItem(
        DATA_KEY,
        JSON.stringify(data)
    );

}


/* =========================================
   SCREEN
========================================= */

function hideScreens(){

    document
        .querySelectorAll(".screen")
        .forEach(el => el.classList.add("hidden"));

}


function goCover(){

    hideScreens();

    document
        .getElementById("coverScreen")
        .classList.remove("hidden");

}


function openReader(){

    hideScreens();

    document
        .getElementById("readerScreen")
        .classList.remove("hidden");

    currentPage = 0;

    renderReader();

}


/* =========================================
   COVER
========================================= */

function renderCover(){

    document.getElementById("coverTitle")
        .textContent = data.title || "Buku Puisiku";

    document.getElementById("coverAuthor")
        .textContent = data.author || "Karya Saya";

    document.getElementById("readerBrand")
        .textContent = data.title || "Buku Puisiku";


    const image =
        document.getElementById("coverImage");


    if(data.photo){

        image.src = data.photo;
        image.classList.remove("hidden");

    }else{

        image.classList.add("hidden");

    }

}


/* =========================================
   READER
========================================= */

function renderReader(){

    const paper =
        document.getElementById("paperContent");


    paper.classList.remove("flip-in");

    void paper.offsetWidth;

    paper.classList.add("flip-in");


    /* PAGE 0 = TABLE OF CONTENTS */

    if(currentPage === 0){

        let html = `

            <div class="paper-inner">

                <div class="book-heading">
                    ${escapeHTML(data.title)}
                </div>

                <div class="book-subheading">
                    ${escapeHTML(data.author)}
                </div>

                <div class="ornament">
                    ✦ ✧ ✦
                </div>

                <div style="
                    text-align:center;
                    font-family:'Cormorant Garamond',serif;
                    font-size:26px;
                    margin-bottom:25px;
                ">
                    Daftar Isi
                </div>

                <div class="toc">
        `;


        if(data.poems.length === 0){

            html += `
                <div class="empty">
                    Belum ada puisi.
                </div>
            `;

        }else{

            data.poems.forEach((poem,index)=>{

                html += `

                    <button class="toc-item"
                            onclick="openPoem(${index})">

                        <span>
                            ${escapeHTML(poem.title)}
                        </span>

                        <span class="toc-line"></span>

                        <span>
                            ${index + 2}
                        </span>

                    </button>

                `;

            });

        }


        html += `

                </div>

                <div style="
                    text-align:center;
                    margin-top:50px;
                    color:#8d7a62;
                    font-family:'Cormorant Garamond',serif;
                    font-size:18px;
                ">
                    Sebuah ruang kecil<br>
                    untuk menyimpan kata-kata.
                </div>

            </div>

        `;


        paper.innerHTML = html;

    }


    /* POEM PAGE */

    else{

        const index = currentPage - 1;

        const poem = data.poems[index];

        if(!poem){

            currentPage = 0;
            renderReader();
            return;

        }


        paper.innerHTML = `

            <div class="paper-inner">

                <div class="poem-number">
                    Puisi ${index + 1}
                </div>

                <div class="poem-title">
                    ${escapeHTML(poem.title)}
                </div>

                <div class="poem-date">
                    ${escapeHTML(poem.date || "")}
                </div>

                <div class="poem-text">
                    ${escapeHTML(poem.text)}
                </div>

            </div>

        `;

    }


    updateNavigation();

}


function openPoem(index){

    currentPage = index + 1;

    renderReader();

}


function nextPage(){

    if(currentPage < data.poems.length){

        currentPage++;

        renderReader();

    }

}


function previousPage(){

    if(currentPage > 0){

        currentPage--;

        renderReader();

    }

}


function updateNavigation(){

    document.getElementById("prevBtn")
        .disabled = currentPage === 0;

    document.getElementById("nextBtn")
        .disabled =
        currentPage === data.poems.length;


    document.getElementById("pageInfo")
        .textContent =
        `${currentPage + 1} / ${data.poems.length + 1}`;

}


/* =========================================
   AUTHOR LOGIN
========================================= */

function authorLogin(){

    const password =
        localStorage.getItem(PASSWORD_KEY);


    if(!password){

        createPassword();

        return;

    }


    openModal(`

        <h2>Mode Penulis</h2>

        <p style="
            color:#aaa;
            font-size:13px;
            margin-bottom:15px;
        ">
            Masukkan password untuk mengelola buku.
        </p>

        <div class="form-group">

            <input id="loginPassword"
                   type="password"
                   placeholder="Password">

        </div>

        <div class="modal-buttons">

            <button class="btn btn-secondary"
                    onclick="closeModal()">
                Batal
            </button>

            <button class="btn btn-primary"
                    onclick="checkPassword()">
                Masuk
            </button>

        </div>

    `);

}


function createPassword(){

    openModal(`

        <h2>Buat Password Penulis</h2>

        <p style="
            color:#aaa;
            font-size:13px;
            line-height:1.5;
            margin-bottom:15px;
        ">
            Buat password untuk mengakses Mode Penulis.
        </p>

        <div class="form-group">

            <input id="newPassword"
                   type="password"
                   placeholder="Password baru">

        </div>

        <div class="modal-buttons">

            <button class="btn btn-primary"
                    onclick="saveNewPassword()">
                Buat Password
            </button>

        </div>

    `);

}


function saveNewPassword(){

    const password =
        document.getElementById("newPassword")
        .value.trim();


    if(password.length < 4){

        alert("Password minimal 4 karakter.");

        return;

    }


    localStorage.setItem(
        PASSWORD_KEY,
        password
    );

    closeModal();

    enterAuthor();

}


function checkPassword(){

    const input =
        document.getElementById("loginPassword")
        .value;


    const saved =
        localStorage.getItem(PASSWORD_KEY);


    if(input === saved){

        closeModal();

        enterAuthor();

    }else{

        alert("Password salah.");

    }

}


function changePassword(){

    openModal(`

        <h2>Ganti Password</h2>

        <div class="form-group">

            <label>Password lama</label>

            <input id="oldPassword"
                   type="password">

        </div>

        <div class="form-group">

            <label>Password baru</label>

            <input id="newPassword2"
                   type="password">

        </div>

        <div class="modal-buttons">

            <button class="btn btn-secondary"
                    onclick="closeModal()">
                Batal
            </button>

            <button class="btn btn-primary"
                    onclick="saveChangedPassword()">
                Simpan
            </button>

        </div>

    `);

}


function saveChangedPassword(){

    const oldPass =
        document.getElementById("oldPassword").value;

    const newPass =
        document.getElementById("newPassword2").value.trim();


    if(
        oldPass !==
        localStorage.getItem(PASSWORD_KEY)
    ){

        alert("Password lama salah.");

        return;

    }


    if(newPass.length < 4){

        alert("Password baru minimal 4 karakter.");

        return;

    }


    localStorage.setItem(
        PASSWORD_KEY,
        newPass
    );

    closeModal();

    alert("Password berhasil diganti.");

}


/* =========================================
   AUTHOR SCREEN
========================================= */

function enterAuthor(){

    hideScreens();

    document
        .getElementById("authorScreen")
        .classList.remove("hidden");


    document.getElementById("titleInput")
        .value = data.title;

    document.getElementById("authorInput")
        .value = data.author;


    renderAuthorPoems();

}


function renderAuthorPoems(){

    const box =
        document.getElementById("authorPoemList");


    if(data.poems.length === 0){

        box.innerHTML = `
            <div class="empty">
                Belum ada puisi.<br>
                Klik "Puisi Baru" untuk membuat puisi pertamamu.
            </div>
        `;

        return;

    }


    box.innerHTML = "";


    data.poems.forEach((poem,index)=>{

        const item =
            document.createElement("div");

        item.className = "author-poem";


        item.innerHTML = `

            <div>

                <div class="author-poem-title">
                    ${escapeHTML(poem.title)}
                </div>

                <div style="
                    font-size:11px;
                    color:#8f8375;
                    margin-top:3px;
                ">
                    ${escapeHTML(poem.date || "")}
                </div>

            </div>

            <div class="author-poem-actions">

                <button class="small-btn"
                        onclick="editPoem(${index})">
                    Edit
                </button>

                <button class="small-btn danger"
                        onclick="deletePoem(${index})">
                    Hapus
                </button>

            </div>

        `;


        box.appendChild(item);

    });

}


/* =========================================
   SAVE COVER
========================================= */

function saveCover(){

    data.title =
        document.getElementById("titleInput")
        .value.trim()
        || "Buku Puisiku";


    data.author =
        document.getElementById("authorInput")
        .value.trim()
        || "Karya Saya";


    const file =
        document.getElementById("coverInput")
        .files[0];


    if(file){

        compressImage(file)
            .then(result=>{

                data.photo = result;

                saveData();

                renderCover();

                alert("Sampul berhasil disimpan.");

            });

    }else{

        saveData();

        renderCover();

        alert("Sampul berhasil disimpan.");

    }

}


/* =========================================
   NEW POEM
========================================= */

function newPoem(){

    openPoemEditor(-1);

}


function editPoem(index){

    openPoemEditor(index);

}


function openPoemEditor(index){

    const poem =
        index >= 0
        ? data.poems[index]
        : {
            title:"",
            text:"",
            date:new Date().toLocaleDateString(
                "id-ID",
                {
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )
        };


    openModal(`

        <h2>
            ${index >= 0
                ? "Edit Puisi"
                : "Puisi Baru"}
        </h2>

        <div class="form-group">

            <label>Judul puisi</label>

            <input id="poemTitle"
                   value="${escapeAttribute(poem.title)}"
                   placeholder="Contoh: Memandangmu">

        </div>

        <div class="form-group">

            <label>Tanggal</label>

            <input id="poemDate"
                   value="${escapeAttribute(poem.date || "")}"
                   placeholder="Tanggal">

        </div>

        <div class="form-group">

            <label>Isi puisi</label>

            <textarea id="poemText"
                      placeholder="Tuliskan puisimu di sini...">${escapeHTML(poem.text)}</textarea>

        </div>

        <div class="modal-buttons">

            <button class="btn btn-secondary"
                    onclick="closeModal()">
                Batal
            </button>

            <button class="btn btn-primary"
                    onclick="savePoem(${index})">
                Simpan Puisi
            </button>

        </div>

    `);

}


function savePoem(index){

    const title =
        document.getElementById("poemTitle")
        .value.trim();


    const date =
        document.getElementById("poemDate")
        .value.trim();


    const text =
        document.getElementById("poemText")
        .value.trim();


    if(!title || !text){

        alert("Judul dan isi puisi wajib diisi.");

        return;

    }


    const poem = {
        title,
        date,
        text
    };


    if(index === -1){

        data.poems.push(poem);

    }else{

        data.poems[index] = poem;

    }


    saveData();

    closeModal();

    renderAuthorPoems();

    alert(
        index === -1
        ? "Puisi berhasil ditambahkan."
        : "Puisi berhasil diperbarui."
    );

}


function deletePoem(index){

    const poem =
        data.poems[index];


    if(
        !confirm(
            `Hapus puisi "${poem.title}"?`
        )
    ){

        return;

    }


    data.poems.splice(index,1);

    saveData();

    renderAuthorPoems();

}


/* =========================================
   IMAGE COMPRESSION
========================================= */

function compressImage(file){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();


        reader.onload = function(e){

            const img =
                new Image();


            img.onload = function(){

                const maxSize = 1200;

                let width =
                    img.width;

                let height =
                    img.height;


                if(width > maxSize){

                    height =
                        height *
                        maxSize /
                        width;

                    width =
                        maxSize;

                }


                if(height > maxSize){

                    width =
                        width *
                        maxSize /
                        height;

                    height =
                        maxSize;

                }


                const canvas =
                    document.createElement("canvas");


                canvas.width = width;
                canvas.height = height;


                const ctx =
                    canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .82
                    )
                );

            };


            img.onerror = reject;

            img.src = e.target.result;

        };


        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* =========================================
   MODAL
========================================= */

function openModal(content){

    document.getElementById("modalContent")
        .innerHTML = content;

    document.getElementById("modalBg")
        .classList.remove("hidden");

}


function closeModal(){

    document.getElementById("modalBg")
        .classList.add("hidden");

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str){

    return String(str ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(str){

    return escapeHTML(str)
        .replace(/\n/g,"&#10;");

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            document
            .getElementById("readerScreen")
            .classList.contains("hidden")
        ){

            return;

        }


        if(e.key === "ArrowRight"){

            nextPage();

        }


        if(e.key === "ArrowLeft"){

            previousPage();

        }


        if(e.key === "Escape"){

            goCover();

        }

    }
);

   START
========================================= */

loadData();

renderCover();
